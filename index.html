<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE WINNER SCHOOL (ISLAMIC CAMPUS)</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#1f2937;font:15px Arial}
header{background:#142f55;color:white;padding:18px 5%}
h1{font-size:22px;margin:0}
main{max-width:1200px;margin:20px auto;padding:0 12px}
.card{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 3px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
input,select,button{padding:10px;border:1px solid #ccd5df;border-radius:7px;font-size:14px}
button{background:#1769aa;color:white;border:0;cursor:pointer;font-weight:bold}
button.gray{background:#64748b}
button.red{background:#c43b43}
button.green{background:#15834a}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:#dce8f5;color:#163b63}
.nav button.active{background:#1769aa;color:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f4f8fc;padding:14px;border-radius:8px}
.stat b{display:block;font-size:24px;margin-top:8px;color:#142f55}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;margin-top:12px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eaf0}
th{background:#f3f6fa}
.muted{color:#64748b;font-size:13px}
.hidden{display:none!important}
.login{max-width:420px;margin:10vh auto}
.staffMode #studentsNav,
.staffMode #holidaysNav,
.staffMode #settingsNav{display:none!important}
.staffMode .contactCol,
.staffMode .waCol{display:none!important}
@media(max-width:650px){
.stats{grid-template-columns:repeat(2,1fr)}
h1{font-size:18px}
}
</style>
</head>

<body>
<header>
<h1>THE WINNER SCHOOL (ISLAMIC CAMPUS)</h1>
<p>Attendance Management • Reports</p>
</header>

<main>
<div id="login" class="card login">
<h2>Staff / Admin Login</h2>
<div class="field">
<label>Email</label>
<input id="username" type="email">
</div>
<div class="field">
<label>Password</label>
<input id="password" type="password">
</div>
<p><button onclick="loginNow()">Login</button></p>
<div id="loginErr"></div>
</div>

<div id="app" class="hidden">
<div class="nav">
<button class="active" onclick="tab('attendance',this)">Attendance</button>
<button onclick="tab('reports',this)">Daily Report</button>
<button id="monthlyNav" onclick="tab('monthly',this)">Monthly Report</button>
<button id="studentsNav" onclick="tab('students',this)">Students</button>
<button id="holidaysNav" onclick="tab('holidays',this)">Holidays</button>
<button id="settingsNav" onclick="tab('settings',this)">Settings</button>
<button class="gray" onclick="logout()">Logout</button>
</div>
<section id="attendance" class="card">
<h2>Daily Attendance</h2>
<div class="grid">
<div class="field"><label>Date</label><input id="attDate" type="date"></div>
<div class="field"><label>Class</label><select id="attClass"></select></div>
</div>
<div class="stats">
<div class="stat">Students<b id="cntAll">0</b></div>
<div class="stat">Present<b id="cntP">0</b></div>
<div class="stat">Absent<b id="cntA">0</b></div>
<div class="stat">Leave<b id="cntL">0</b></div>
</div>
<div class="tablewrap">
<table><thead><tr><th>Student</th><th>Roll</th><th>Status</th><th class="contactCol">Contact</th><th class="waCol">WhatsApp</th></tr></thead>
<tbody id="attRows"></tbody></table>
</div>
<p><button onclick="saveAttendance()">Save Attendance</button></p>
</section>

<section id="reports" class="card hidden">
<h2>Daily Report</h2>
<div class="grid">
<div class="field"><label>Date</label><input id="reportDate" type="date"></div>
<div class="field"><label>Class (blank = all)</label><input id="reportClass"></div>
</div>
<p><button onclick="renderReport()">Generate Report</button></p>
<div id="reportOutput"></div>
</section>

<section id="monthly" class="card hidden">
<h2>Monthly Report</h2>
<div class="grid">
<div class="field"><label>Month</label><input id="monthPick" type="month"></div>
<div class="field"><label>Class</label><input id="monthClass"></div>
<div class="field"><label>Student</label><select id="monthStudent"><option value="">All Students</option></select></div>
</div>
<p><button onclick="monthlyReport()">View Monthly Report</button>
<button class="gray" onclick="printMonthly()">Print / PDF</button></p>
<div id="monthOutput"></div>
</section>

<section id="students" class="card hidden">
<h2>Student Register (Admin)</h2>
<div class="grid">
<input id="sName" placeholder="Student Name">
<input id="sRoll" placeholder="Roll No">
<input id="sClass" placeholder="Class">
<input id="pName" placeholder="Parent Name">
<input id="pPhone" placeholder="Parent WhatsApp">
</div>
<p><button onclick="addStudent()">Add Student</button></p>
<div id="studentRows"></div>
</section>

<section id="holidays" class="card hidden">
<h2>Holiday Manager (Admin)</h2>
<input id="holidayName" placeholder="Holiday Name">
<input id="holidayFrom" type="date">
<input id="holidayTo" type="date">
<button onclick="addHoliday()">Add Holiday</button>
<div id="holidayList"></div>
</section>

<section id="settings" class="card hidden">
<h2>Admin Settings</h2>
<button onclick="backup()">Download Backup</button>
<button onclick="document.getElementById('restoreFile').click()">Restore Backup</button>
<input id="restoreFile" type="file" class="hidden" onchange="restore(event)">
<button class="red" onclick="resetAll()">Reset Data</button>
</section>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBoeVKahBPXx-sPE57nH-ylkl5c1djSTmE",
authDomain:"the-winner-school-attendence.firebaseapp.com",
databaseURL:"https://the-winner-school-attendence-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"the-winner-school-attendence",
storageBucket:"the-winner-school-attendence.firebasestorage.app",
messagingSenderId:"255019225232",
appId:"1:255019225232:web:2c2cbeaaabffd7899c8815"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
let students=[],records={},holidays=[],current=null,syncing=false;

const ADMIN_EMAIL="maryamsarwar@gmail.com";
const today=new Date().toISOString().slice(0,10);
attDate.value=today;
reportDate.value=today;
monthPick.value=today.slice(0,7);

function persist(){
if(!auth.currentUser||syncing)return;
db.ref("schoolAttendance").set({students,records,holidays});
}

function startCloud(){
db.ref("schoolAttendance").on("value",snap=>{
syncing=true;
let x=snap.val()||{};
students=Array.isArray(x.students)?x.students:[];
records=x.records||{};
holidays=x.holidays||[];
syncing=false;
populateClasses();
renderAttendance();
renderStudents();
renderReport();
});
}

function loginNow(){
auth.signInWithEmailAndPassword(username.value.trim(),password.value)
.catch(e=>loginErr.textContent=e.message);
}

auth.onAuthStateChanged(user=>{
if(user){
current={email:user.email,role:user.email.toLowerCase()===ADMIN_EMAIL?"admin":"staff"};
login.classList.add("hidden");
app.classList.remove("hidden");
applyRole();
startCloud();
}else{
current=null;
app.classList.add("hidden");
login.classList.remove("hidden");
}
});

function applyRole(){
app.classList.toggle("staffMode",current.role==="staff");
let admin=current.role==="admin";
["studentsNav","holidaysNav","settingsNav"].forEach(id=>{
document.getElementById(id).classList.toggle("hidden",!admin);
});
if(!admin){
document.querySelectorAll("#attendance .contactCol,#attendance .waCol").forEach(x=>x.style.display="none");
document.querySelectorAll("#monthly th:last-child,#monthly td:last-child").forEach(x=>x.style.display="none");
}
}

function logout(){
auth.signOut();
db.ref("schoolAttendance").off();
}

function tab(id,b){
if(current.role==="staff"&&!["attendance","reports","monthly"].includes(id)){
alert("Admin access only");return;
}
document.querySelectorAll("#app section").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
if(id==="students")renderStudents();
if(id==="reports")renderReport();
if(id==="monthly"){populateMonthStudents();monthlyReport()}
if(id==="holidays")renderHolidays();
}

function k(d,id){return d+"_"+id}

function populateClasses(){
let cs=[...new Set(students.map(s=>s.cls))].sort();
attClass.innerHTML=cs.map(c=>`<option>${esc(c)}</option>`).join("");
}

function addStudent(){
if(current.role!=="admin")return alert("Admin only");
let n=sName.value.trim(),cl=sClass.value.trim();
if(!n||!cl)return alert("Name and class required");
students.push({
id:Date.now().toString(),name:n,roll:sRoll.value,
cls:cl,parent:pName.value,phone:pPhone.value.replace(/\D/g,"")
});
persist();populateClasses();renderStudents();renderAttendance();
}

function renderAttendance(){
let cl=attClass.value,d=attDate.value,off=isHoliday(d);
let list=students.filter(s=>!cl||s.cls===cl);
let c={Present:0,Absent:0,Leave:0};
list.forEach(s=>{let st=records[k(d,s.id)]||"";if(c[st]!=null)c[st]++});
cntAll.textContent=list.length;
cntP.textContent=c.Present;cntA.textContent=c.Absent;cntL.textContent=c.Leave;

attRows.innerHTML=off?
'<tr><td colspan="5">Sunday / Holiday — Attendance disabled</td></tr>':
list.map(s=>`<tr>
<td>${esc(s.name)}</td><td>${esc(s.roll||"-")}</td>
<td><select data-id="${s.id}" onchange="records[k(attDate.value,this.dataset.id)]=this.value;persist();renderAttendance()">
<option value="">Unmarked</option>
${["Present","Absent","Leave"].map(v=>`<option ${records[k(d,s.id)]===v?"selected":""}>${v}</option>`).join("")}
</select></td>
<td class="contactCol">${esc(s.phone||"-")}</td>
<td class="waCol">${records[k(d,s.id)]==="Absent"?`<button onclick="sendWA('${s.id}')">WhatsApp</button>`:"-"}</td>
</tr>`).join("");
}

function saveAttendance(){
if(isHoliday(attDate.value))return alert("Sunday/Holiday attendance disabled");
persist();alert("Attendance saved");renderAttendance();
}

function renderStudents(){
studentRows.innerHTML=students.map(s=>`<p>${esc(s.name)} | ${esc(s.roll)} | ${esc(s.cls)}
${current.role==="admin"?`<button class="red" onclick="del('${s.id}')">Delete</button>`:""}</p>`).join("");
}
function del(id){
if(current.role!=="admin")return alert("Admin only");
if(confirm("Delete student?")){
students=students.filter(s=>s.id!==id);persist();populateClasses();renderStudents();renderAttendance();
}
}

function renderReport(){
let d=reportDate.value,cl=reportClass.value.trim().toLowerCase();
let list=students.filter(s=>!cl||s.cls.toLowerCase().includes(cl));
let c={Present:0,Absent:0,Leave:0,Unmarked:0};
list.forEach(s=>{let st=records[k(d,s.id)]||"Unmarked";c[st]++});
reportOutput.innerHTML=`<h3>Date: ${d}</h3>
<p>Total ${list.length} | Present ${c.Present} | Absent ${c.Absent} | Leave ${c.Leave} | Unmarked ${c.Unmarked}</p>`;
}

function isHoliday(d){
return new Date(d+"T12:00:00").getDay()===0||holidays.some(h=>d>=h.from&&d<=h.to);
}

function populateMonthStudents(){
let cl=monthClass.value.trim().toLowerCase();
monthStudent.innerHTML='<option value="">All Students</option>'+
students.filter(s=>!cl||s.cls.toLowerCase().includes(cl))
.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
}

function monthDays(){
let m=monthPick.value;if(!m)return [];
let[y,mo]=m.split("-").map(Number),a=[];
for(let i=1;i<=new Date(y,mo,0).getDate();i++){
let d=`${y}-${String(mo).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
if(!isHoliday(d))a.push(d);
}
return a;
}

function monthlyData(){
let days=monthDays(),cl=monthClass.value.trim().toLowerCase(),sid=monthStudent.value;
let list=students.filter(s=>(!cl||s.cls.toLowerCase().includes(cl))&&(!sid||s.id===sid));
return {days,rows:list.map(s=>{
let c={Present:0,Absent:0,Leave:0,Unmarked:0};
days.forEach(d=>c[records[k(d,s.id)]||"Unmarked"]++);
let marked=c.Present+c.Absent+c.Leave;
return{s,c,pct:marked?Math.round(c.Present/marked*100):0};
})};
}

function monthlyReport(){
populateMonthStudents();
let{days,rows}=monthlyData();
monthOutput.innerHTML=`<p>Working days: ${days.length}</p>
<table><tr><th>Student</th><th>Present</th><th>Absent</th><th>Leave</th><th>%</th></tr>
${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.c.Present}</td><td>${r.c.Absent}</td><td>${r.c.Leave}</td><td>${r.pct}%</td></tr>`).join("")}</table>`;
}

function printMonthly(){
monthlyReport();
let w=window.open("","_blank");
w.document.write("<html><body><h2>THE WINNER SCHOOL</h2>"+monthOutput.innerHTML+"</body></html>");
w.document.close();w.print();
}

function addHoliday(){
if(current.role!=="admin")return alert("Admin only");
let n=holidayName.value.trim(),f=holidayFrom.value,t=holidayTo.value;
if(!n||!f||!t||f>t)return alert("Valid details required");
holidays.push({id:Date.now().toString(),name:n,from:f,to:t});
persist();renderHolidays();
}
function renderHolidays(){
holidayList.innerHTML=holidays.map(h=>`<p>${esc(h.name)} ${h.from}–${h.to}
<button onclick="removeHoliday('${h.id}')">Remove</button></p>`).join("");
}
function removeHoliday(id){
if(current.role!=="admin")return alert("Admin only");
holidays=holidays.filter(h=>h.id!==id);persist();renderHolidays();
}

function backup(){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([JSON.stringify({students,records,holidays})]));
a.download="winner-backup.json";a.click();
}
function restore(e){
if(current.role!=="admin")return alert("Admin only");
let r=new FileReader();r.onload=()=>{
let x=JSON.parse(r.result);students=x.students||[];records=x.records||{};holidays=x.holidays||[];
persist();populateClasses();renderAttendance();renderStudents();
};r.readAsText(e.target.files[0]);
}
function resetAll(){
if(current.role!=="admin")return alert("Admin only");
if(confirm("Delete all data?")){students=[];records={};holidays=[];persist();populateClasses();renderAttendance();renderStudents()}
}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
attDate.addEventListener("change",renderAttendance);
attClass.addEventListener("change",renderAttendance);
monthClass.addEventListener("change",populateMonthStudents);
</script>
</body>
</html>
