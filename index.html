<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Winner School Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#172033;font:15px Arial}
header{background:#142f55;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:22px}
main{max-width:1100px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
input,select,button{padding:11px;border:1px solid #ccd4df;border-radius:7px;font-size:15px}
input,select{width:100%;margin:5px 0}
button{background:#1769aa;color:white;border:0;cursor:pointer;font-weight:bold;margin:4px}
button.gray{background:#64748b}
button.red{background:#c43b43}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.stat{background:#eef5ff;padding:14px;border-radius:10px}
.stat b{font-size:24px;display:block;margin-top:5px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #dbe2ec;padding:9px;text-align:left}
th{background:#edf3fa}
.tablewrap{overflow:auto}
.login{max-width:430px;margin:50px auto}
#error{color:#c43b43;white-space:pre-wrap}
@media(max-width:600px){header h1{font-size:18px}.card{padding:12px}}
</style>
</head>
<body>

<header>
<h1>THE WINNER SCHOOL (ISLAMIC CAMPUS)</h1>
<p>Attendance Management • Reports</p>
</header>

<main>

<!-- LOGIN -->
<section id="login" class="card login">
<h2>Staff / Admin Login</h2>
<label>Admin Email / Staff ID</label>
<input id="username" placeholder="Admin email or Staff ID" autocomplete="username">
<label>Password</label>
<input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
<button onclick="loginNow()">Login</button>
<p id="error"></p>
</section>

<!-- APP -->
<section id="app" class="hidden">

<div class="card">
<div class="nav">
<button onclick="showTab('attendance')">Attendance</button>
<button onclick="showTab('students')">Students</button>
<button onclick="showTab('reports')">Reports</button>
<button onclick="showTab('settings')">Settings</button>
<button class="red" onclick="logoutNow()">Logout</button>
</div>
<p id="userInfo"></p>
</div>

<!-- ATTENDANCE -->
<section id="attendance" class="tab">
<div class="card">
<h2>Daily Attendance</h2>
<div class="grid">
<div><label>Date</label><input type="date" id="attDate"></div>
<div><label>Class</label><select id="attClass"></select></div>
</div>
<div class="grid">
<div class="stat">Students <b id="totalCount">0</b></div>
<div class="stat">Present <b id="presentCount">0</b></div>
<div class="stat">Absent <b id="absentCount">0</b></div>
<div class="stat">Leave <b id="leaveCount">0</b></div>
</div>
<div class="card">
<div class="tablewrap">
<table>
<thead><tr><th>Student</th><th>Roll No.</th><th>Status</th></tr></thead>
<tbody id="attendanceTable"></tbody>
</table>
</div>
<button onclick="saveAttendance()">Save Attendance</button>
<button onclick="openAbsentWhatsApp()">WhatsApp Absentees</button>
</div>
</section>

<!-- STUDENTS -->
<section id="students" class="tab hidden">
<div class="card">
<h2>Student Register</h2>
<div id="addStudentBox">
<div class="grid">
<input id="studentName" placeholder="Student name">
<input id="studentRoll" placeholder="Roll number">
<input id="studentClass" placeholder="Class / Section">
<input id="parentName" placeholder="Parent name">
<input id="parentPhone" placeholder="Parent WhatsApp (923...)">
</div>
<button onclick="addStudent()">Add Student</button>
</div>
<button onclick="exportStudents()">Export Students CSV</button>
<div class="tablewrap">
<table>
<thead><tr><th>Name</th><th>Roll</th><th>Class</th><th>Parent</th><th>Phone</th><th>Action</th></tr></thead>
<tbody id="studentTable"></tbody>
</table>
</div>
</div>
</section>

<!-- REPORTS -->
<section id="reports" class="tab hidden">
<div class="card">
<h2>Daily Report</h2>
<div class="grid">
<input type="date" id="reportDate">
<select id="reportClass"></select>
</div>
<button onclick="dailyReport()">Generate Report</button>
<button onclick="exportReport()">Export CSV</button>
<div id="reportOutput"></div>
</div>
</section>

<!-- SETTINGS -->
<section id="settings" class="tab hidden">
<div class="card">
<h2>Settings & Backup</h2>
<p id="settingsAdmin"></p>
<button onclick="backupData()">Download Backup JSON</button>
<input type="file" id="restoreFile" accept=".json">
<button onclick="restoreData()">Restore Backup</button>
<button class="red" onclick="resetData()">Reset All Data</button>
</div>
</section>

</section>
</main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoeVKahBPXx-sPE57nH-ylkl5c1djSTmE",
  authDomain: "the-winner-school-attendence.firebaseapp.com",
  databaseURL: "https://the-winner-school-attendence-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "the-winner-school-attendence",
  storageBucket: "the-winner-school-attendence.firebasestorage.app",
  messagingSenderId: "255019225232",
  appId: "1:255019225232:web:2c2cbeaaabffd7899c8815",
  measurementId: "G-JBQ6F69KSK"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "maryamsarwar041@gmail.com";
let currentUser = null;
let isAdmin = false;
let students = [];
let records = {};
let classes = [];

const $ = id => document.getElementById(id);

function today(){
  return new Date().toISOString().slice(0,10);
}

function staffEmail(id){
  id = id.trim().toLowerCase();
  return id.includes("@") ? id : id + "@winner-school.local";
}

function loginNow(){
  $("error").textContent = "";
  let username = $("username").value.trim();
  let password = $("password").value;

  if(!username || !password){
    $("error").textContent = "Please enter username and password.";
    return;
  }

  let email = username.toLowerCase() === ADMIN_EMAIL
    ? ADMIN_EMAIL
    : staffEmail(username);

  auth.signInWithEmailAndPassword(email,password)
    .catch(err=>{
      $("error").textContent = "Login failed: " + err.message;
    });
}

function logoutNow(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(!user){
    $("login").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }

  currentUser = user;
  isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userInfo").textContent = isAdmin
    ? "Logged in: ADMIN"
    : "Logged in: STAFF (Read/Attendance access)";

  $("addStudentBox").classList.toggle("hidden",!isAdmin);
  $("settingsAdmin").textContent = isAdmin
    ? "Admin access enabled."
    : "Settings are available to Admin only.";

  if(!isAdmin){
    $("settings").classList.add("hidden");
  }

  startCloud();
});

function startCloud(){
  db.ref("schoolAttendance/students").on("value",snap=>{
    students = snap.val() || [];
    populateClasses();
    renderStudents();
    renderAttendance();
    dailyReport();
  });

  db.ref("schoolAttendance/records").on("value",snap=>{
    records = snap.val() || {};
    renderAttendance();
    dailyReport();
  });
}

function saveStudents(){
  if(!isAdmin)return;
  db.ref("schoolAttendance/students").set(students);
}

function saveRecords(){
  db.ref("schoolAttendance/records").set(records);
}

function populateClasses(){
  classes = [...new Set(students.map(s=>s.cls).filter(Boolean))].sort();

  ["attClass","reportClass"].forEach(id=>{
    let el=$(id);
    let old=el.value;
    el.innerHTML='<option value="">All Classes</option>';
    classes.forEach(c=>{
      el.innerHTML+=`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`;
    });
    if(classes.includes(old))el.value=old;
  });
}

function escapeHTML(s){
  return String(s||"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[m]));
}

function showTab(tab){
  document.querySelectorAll(".tab").forEach(el=>el.classList.add("hidden"));
  $(tab).classList.remove("hidden");
  if(tab==="attendance")renderAttendance();
  if(tab==="students")renderStudents();
  if(tab==="reports")dailyReport();
}

function addStudent(){
  if(!isAdmin)return alert("Admin access only.");

  let name=$("studentName").value.trim();
  let roll=$("studentRoll").value.trim();
  let cls=$("studentClass").value.trim();

  if(!name||!roll||!cls)return alert("Name, Roll and Class are required.");

  students.push({
    id:Date.now().toString(),
    name,roll,cls,
    parent:$("parentName").value.trim(),
    phone:$("parentPhone").value.trim()
  });

  saveStudents();

  ["studentName","studentRoll","studentClass","parentName","parentPhone"]
    .forEach(id=>$(id).value="");
}

function renderStudents(){
  $("studentTable").innerHTML=students.map(s=>`
    <tr>
      <td>${escapeHTML(s.name)}</td>
      <td>${escapeHTML(s.roll)}</td>
      <td>${escapeHTML(s.cls)}</td>
      <td>${escapeHTML(s.parent)}</td>
      <td>${escapeHTML(s.phone)}</td>
      <td>${isAdmin
        ? `<button class="red" onclick="deleteStudent('${s.id}')">Delete</button>`
        : "View only"}
      </td>
    </tr>
  `).join("");
}

function deleteStudent(id){
  if(!isAdmin)return alert("Admin only.");
  if(!confirm("Delete this student?"))return;
  students=students.filter(s=>s.id!==id);
  saveStudents();
}

function renderAttendance(){
  let date=$("attDate").value||today();
  let cls=$("attClass").value;

  let list=students.filter(s=>!cls||s.cls===cls);
  let counts={Present:0,Absent:0,Leave:0};

  $("attendanceTable").innerHTML=list.map(s=>{
    let status=records[date]?.[s.id]||"Unmarked";
    if(counts[status]!==undefined)counts[status]++;

    return `<tr>
      <td>${escapeHTML(s.name)}</td>
      <td>${escapeHTML(s.roll)}</td>
      <td>
        <select onchange="setStatus('${date}','${s.id}',this.value)">
          <option ${status==="Unmarked"?"selected":""}>Unmarked</option>
          <option ${status==="Present"?"selected":""}>Present</option>
          <option ${status==="Absent"?"selected":""}>Absent</option>
          <option ${status==="Leave"?"selected":""}>Leave</option>
        </select>
      </td>
    </tr>`;
  }).join("");

  $("totalCount").textContent=list.length;
  $("presentCount").textContent=counts.Present;
  $("absentCount").textContent=counts.Absent;
  $("leaveCount").textContent=counts.Leave;
}

function setStatus(date,id,status){
  if(!records[date])records[date]={};
  records[date][id]=status;
  renderAttendance();
}

function saveAttendance(){
  saveRecords();
  alert("Attendance saved.");
}

function renderAttendanceRefresh(){
  renderAttendance();
}
  function dailyReport(){
  let date=$("reportDate").value||today();
  let cls=$("reportClass").value;
  let list=students.filter(s=>!cls||s.cls===cls);
  let c={Present:0,Absent:0,Leave:0,Unmarked:0};

  list.forEach(s=>{
    let st=records[date]?.[s.id]||"Unmarked";
    c[st]=(c[st]||0)+1;
  });

  $("reportOutput").innerHTML=`
    <h3>Report: ${escapeHTML(date)}</h3>
    <p>Students: ${list.length}</p>
    <p>Present: ${c.Present}</p>
    <p>Absent: ${c.Absent}</p>
    <p>Leave: ${c.Leave}</p>
    <p>Unmarked: ${c.Unmarked}</p>
  `;
}

function openAbsentWhatsApp(){
  let date=$("attDate").value||today();
  let cls=$("attClass").value;

  let absent=students.filter(s=>
    (!cls||s.cls===cls)&&records[date]?.[s.id]==="Absent"
  );

  if(!absent.length)return alert("No absent students found.");

  let i=0;

  function next(){
    if(i>=absent.length){
      alert("All parent WhatsApp chats opened. Please press Send in WhatsApp.");
      return;
    }

    let s=absent[i++];
    if(!s.phone){
      next();
      return;
    }

    let phone=s.phone.replace(/\D/g,"");
    let msg=`Assalam-o-Alaikum Dear Parent,
Your child ${s.name} (${s.cls}) is marked ABSENT today (${date}).
Kindly ensure regular attendance.
Regards, The Winner School (Islamic Campus).`;

    window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");

    if(i<absent.length && confirm("Next parent?")){
      next();
    }
  }

  next();
}

function csvDownload(filename,text){
  let blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportStudents(){
  if(!isAdmin)return alert("Admin only.");

  let rows=[["Name","Roll","Class","Parent","Phone"]];
  students.forEach(s=>rows.push([s.name,s.roll,s.cls,s.parent,s.phone]));

  csvDownload("winner-students.csv",
    rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n")
  );
}

function exportReport(){
  let date=$("reportDate").value||today();
  let cls=$("reportClass").value;

  let list=students.filter(s=>!cls||s.cls===cls);
  let rows=[["Date","Name","Roll","Class","Status"]];

  list.forEach(s=>{
    rows.push([
      date,s.name,s.roll,s.cls,
      records[date]?.[s.id]||"Unmarked"
    ]);
  });

  csvDownload("winner-attendance-report.csv",
    rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n")
  );
}

function backupData(){
  if(!isAdmin)return alert("Admin only.");

  let data={
    students,
    records,
    backupDate:new Date().toISOString(),
    school:"THE WINNER SCHOOL (ISLAMIC CAMPUS)"
  };

  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="winner-attendance-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function restoreData(){
  if(!isAdmin)return alert("Admin only.");

  let file=$("restoreFile").files[0];
  if(!file)return alert("Please select a backup file.");
  if(!confirm("Restore backup? Existing data will be replaced."))return;

  let reader=new FileReader();
  reader.onload=()=>{
    try{
      let data=JSON.parse(reader.result);
      if(!Array.isArray(data.students)||typeof data.records!=="object"){
        throw new Error("Invalid backup file");
      }

      students=data.students;
      records=data.records||{};

      saveStudents();
      saveRecords();

      alert("Backup restored successfully.");
    }catch(e){
      alert("Restore failed: "+e.message);
    }
  };
  reader.readAsText(file);
}

function resetData(){
  if(!isAdmin)return alert("Admin only.");
  if(!confirm("WARNING: Reset ALL students and attendance?"))return;
  if(!confirm("Are you absolutely sure?"))return;

  students=[];
  records={};
  saveStudents();
  saveRecords();
  alert("Data reset.");
}

$("attDate").value=today();
$("reportDate").value=today();

$("attDate").addEventListener("change",renderAttendance);
$("attClass").addEventListener("change",renderAttendance);
$("reportDate").addEventListener("change",dailyReport);
$("reportClass").addEventListener("change",dailyReport);

</script>
</body>
</html>
